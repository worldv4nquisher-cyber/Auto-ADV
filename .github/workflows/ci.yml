name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 类型检查与单元测试（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g pnpm@10.28.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  windows-app:
    name: Windows 安装包与端到端测试
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g pnpm@10.28.0
      - run: pnpm install --frozen-lockfile
      - name: 构建
        run: pnpm build
      - name: 端到端测试（开发构建）
        run: pnpm --filter @auto-adv/desktop e2e
      - name: 打包安装程序
        working-directory: apps/desktop
        run: pnpm exec electron-builder --win --publish never
      - name: 端到端测试（打包后的应用）
        working-directory: apps/desktop
        run: pnpm e2e
        env:
          E2E_APP_PATH: release/win-unpacked/Auto-ADV.exe
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: Auto-ADV-Windows-Setup
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
